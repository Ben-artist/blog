name: Dual Deployment (Aliyun + GitHub Pages)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-dist
          path: .vitepress/dist
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  # 阿里云 SCP 单独作业，失败不影响 GitHub Pages
  deploy-aliyun:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: vitepress-dist
          path: dist

      # 使用 SSH 私钥（推荐）。在 GitHub Secrets 配置：
      #   SSH_PRIVATE_KEY  — 完整私钥（含 BEGIN/END 行）
      #   FTP_USERNAME     — 服务器 SSH 用户名（如 root / ubuntu）
      # 服务器需将对应公钥写入 ~/.ssh/authorized_keys
      - name: Deploy to Aliyun Server
        uses: appleboy/scp-action@v1
        with:
          host: 47.120.71.238
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/"
          target: "/usr/local/nginx/html/blog"
          strip_components: 1
          overwrite: true

  deploy-github:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
